<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>humanology_daily Shorts Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gamja+Flower&family=Hi+Melody&family=Noto+Sans+KR:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#fff;font-family:'Noto Sans KR',sans-serif}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 70px}
.brand{font-weight:900;font-size:28px;color:#ff453a;letter-spacing:-0.5px}
.sub{color:#9ea5b5;margin:6px 0 26px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
.card{background:#171a22;border:1px solid #2b3040;border-radius:18px;padding:20px}
h2{margin:0 0 15px;font-size:19px;display:flex;align-items:center;gap:8px}
label{display:block;color:#b9bfcc;font-size:13px;margin:12px 0 6px}
input,select,textarea{width:100%;background:#0e1016;color:#fff;border:1px solid #343a4a;border-radius:10px;padding:12px;font-size:15px;font-family:inherit}
button{border:0;border-radius:11px;padding:14px 16px;font-weight:800;cursor:pointer;background:#fff;color:#111;margin-top:12px;transition:0.2s;font-size:16px}
button:hover{opacity:0.9}
button.accent{background:#ff3b30;color:white}
button.secondary{background:#272c38;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:#241d12;border:1px solid #5a4320;color:#ffd98a;padding:14px 18px;border-radius:14px;margin-bottom:20px;font-size:14px;line-height:1.5}
.status{margin-top:14px;color:#aeb6c8;font-size:14px;font-weight:bold}
.renderer{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px}
.stage{background:#0e1016;border-radius:16px;padding:18px;min-height:520px;display:flex;flex-direction:column;justify-content:center}
.canvas-wrap{display:flex;justify-content:center;align-items:center;gap:12px;position:relative}
.nav-btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid #343a4a;border-radius:50%;width:46px;height:46px;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;padding:0;transition:0.2s;user-select:none;flex-shrink:0}
.nav-btn:hover{background:#ff3b30;border-color:#ff3b30;color:#fff}
.preview-canvas{width:min(100%,360px);height:auto;aspect-ratio:9/16;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#090b10}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.thumb{background:#090b10;border:2px solid transparent;border-radius:9px;padding:3px;cursor:pointer;position:relative}
.thumb.active{border-color:#ff453a}
.thumb canvas{display:block;width:100%;border-radius:6px}
.controls{background:#0e1016;border-radius:16px;padding:18px}
.controls .row{align-items:center}
.downloads{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.downloads button{flex:1;padding:16px}
.check{display:flex;gap:8px;align-items:center;color:#cdd2dc;font-size:14px;margin-top:14px;cursor:pointer}
.check input{width:auto;cursor:pointer;width:18px;height:18px}
textarea{resize:vertical}
.range-val{color:#ff3b30;font-weight:bold;margin-left:6px}
.file-box{border:2px dashed #343a4a;padding:14px;border-radius:12px;text-align:center;background:#11141d;margin-top:8px}
.file-box input[type="file"]{display:none}
.file-label{cursor:pointer;color:#ff453a;font-weight:bold;font-size:14px}

/* 해시태그 박스 스타일 */
.hashtag-box{background:#11141d;border:1px solid #2b3040;border-radius:12px;padding:14px;margin-top:10px}
.hashtag-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag-item{background:#272c38;color:#aeb6c8;font-size:13px;padding:6px 12px;border-radius:20px;cursor:pointer;border:1px solid #3e4558;transition:0.2s;user-select:none}
.tag-item.selected{background:#ff3b30;color:#fff;border-color:#ff3b30;font-weight:bold}
@media(max-width:900px){.renderer{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">♥ humanology_daily</div>
  <div class="sub">왜 저 사람은 저럴까? · 9:16 쇼츠 영상 및 카드 제작기</div>
  
  <div class="notice">
    💡 <b>기본 배경 그래픽이 더욱 고급스럽게 강화되었습니다!</b> 이미지를 업로드하지 않아도 화려하고 입체감 있는 그라데이션과 빛 효과가 자동으로 적용됩니다.
  </div>

  <div class="grid">
    <section class="card">
      <h2>📝 쇼츠 카드 대본 입력</h2>
      <label>카드 대본 붙여넣기 ([CARD 1] 형식 또는 줄바꿈으로 구분)</label>
      <textarea id="scriptInput" rows="6" placeholder="[CARD 1]&#10;좋아할수록 연락이 늦어지는 '진짜 이유' 3가지&#10;&#10;[CARD 2]&#10;관심이 생기면 머릿속으로 '무슨 말을 할까' 고민하느라 늦어짐"></textarea>
      <button type="button" class="accent" id="parseBtn" style="width:100%">✨ 대본으로 카드 생성하기</button>
    </section>

    <section class="card">
      <h2>🖼️ 9:16 쇼츠 카드 렌더러</h2>
      <div class="renderer">
        <div class="stage">
          <div class="canvas-wrap">
            <button type="button" class="nav-btn" id="prevCardBtn" title="이전 카드">❮</button>
            <canvas id="mainCanvas" class="preview-canvas" width="1080" height="1920"></canvas>
            <button type="button" class="nav-btn" id="nextCardBtn" title="다음 카드">❯</button>
          </div>
          <div id="thumbs" class="thumbs"></div>
        </div>

        <div class="controls">
          <label>카드 선택</label>
          <select id="cardSelect"></select>

          <!-- 배경 사진 폴더 선택 -->
          <label>🖼️ 배경 이미지 지정 폴더 선택 (선택 시 감성 배경 적용)</label>
          <div class="file-box">
            <label for="folderInput" class="file-label">📁 사진들이 담긴 폴더 불러오기</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*">
            <div id="imageCount" style="font-size:12px; color:#8a93a6; margin-top:6px;">불러온 이미지: 0개</div>
          </div>

          <label>📸 배경 어둡기 조절 (글씨 시독성)</label>
          <input id="bgDarkness" type="range" min="0.2" max="0.9" step="0.05" value="0.55">

          <label>⏱️ 카드 1장당 재생 시간: <span id="secVal" class="range-val">3초</span></label>
          <input id="cardDuration" type="range" min="1" max="10" step="0.5" value="3">

          <label>폰트 스타일</label>
          <select id="fontFamily">
            <option value="Gaegu" selected>귀여운 손글씨 (Gaegu)</option>
            <option value="Gamja Flower">사랑스러운 필기체 (Gamja Flower)</option>
            <option value="Hi Melody">동글동글 손글씨 (Hi Melody)</option>
            <option value="Noto Sans KR">기본 굵은 고딕 (Noto Sans)</option>
          </select>

          <label>강조 색상</label>
          <select id="accentColor">
            <option value="#ff3b30">레드 (Red)</option>
            <option value="#ff9f0a">오렌지 (Orange)</option>
            <option value="#ffd60a">옐로우 (Yellow)</option>
            <option value="#30d158">그린 (Green)</option>
            <option value="#64d2ff">블루 (Blue)</option>
            <option value="#bf5af2" selected>퍼플/핑크 (Purple)</option>
          </select>

          <!-- 글씨 크기 조절 & 저장 & 해시태그 영역 -->
          <label>글자 크기 조절</label>
          <input id="fontScale" type="range" min="0.75" max="1.25" step="0.01" value="1">
          
          <div class="row">
            <button type="button" class="secondary" id="saveFontScaleBtn" style="flex:1">💾 폰트크기저장</button>
            <button type="button" class="secondary" id="hashtagRecommendBtn" style="flex:1">#️⃣ 해시태그추천</button>
          </div>

          <!-- 해시태그 결과 출력 박스 -->
          <div id="hashtagBox" class="hashtag-box" style="display:none;">
            <div style="font-size:12px; color:#8a93a6;">💡 클릭하여 태그를 선택/해제한 후 한 번에 복사하세요:</div>
            <div id="hashtagTags" class="hashtag-tags"></div>
            <div class="row" style="margin-top:10px;">
              <button type="button" class="accent" id="copySelectedTagsBtn" style="flex:1; padding:10px; font-size:14px; margin:0;">📋 선택한 태그 복사</button>
              <button type="button" class="secondary" id="copyAllTagsBtn" style="flex:1; padding:10px; font-size:14px; margin:0;">✨ 전체 복사</button>
            </div>
          </div>

          <label>수동 강조 단어 (쉼표 구분)</label>
          <input id="highlightWords" placeholder="예: 진짜 이유, 신중함, 심리">

          <label>현재 카드 문구 직접 수정</label>
          <textarea id="editText" rows="3" placeholder="선택한 카드의 문구를 수정하세요."></textarea>
          
          <div class="row">
            <button type="button" class="secondary" id="applyTextBtn">✏️ 문구 수정 적용</button>
            <button type="button" class="secondary" id="resetTextBtn">↩ 원문 복구</button>
          </div>

          <label class="check">
            <input type="checkbox" id="brandToggle" checked> 하단에 ♥ humanology_daily 크게 표시
          </label>

          <div class="downloads">
            <button type="button" class="accent" id="videoBtn">🎬 쇼츠 영상 다운로드 (WebM)</button>
          </div>

          <div id="renderStatus" class="status">대본을 입력하고 카드를 만들어보세요.</div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const $=id=>document.getElementById(id); 
const W=1080, H=1920; 
let cards=[]; 
let active=0;
let userImages=[]; 
let currentHashtags = [];

const sampleScript = `[CARD 1]
좋아할수록 연락이 늦어지는 '진짜 이유' 3가지

[CARD 2]
관심이 생기면 머릿속으로 '무슨 말을 할까' 고민하느라 늦어짐

[CARD 3]
'가벼워 보이기 싫은' 마음이 신중함으로 바뀌기 때문

[CARD 4]
대화를 오래 이어가고 싶어서 '여유 있는 시간'을 기다리는 중

[CARD 5]
이럴 때는 '천천히 답장해줘도 돼'라고 한마디 건네보세요 ♥`;

$('scriptInput').value = sampleScript;

$('parseBtn').addEventListener('click', parseScriptFromInput);
$('videoBtn').addEventListener('click', recordVideo);

$('prevCardBtn').addEventListener('click', () => {
  if (!cards.length) return;
  active = (active - 1 + cards.length) % cards.length;
  syncEditor();
  renderCard(active);
});

$('nextCardBtn').addEventListener('click', () => {
  if (!cards.length) return;
  active = (active + 1) % cards.length;
  syncEditor();
  renderCard(active);
});

$('cardSelect').addEventListener('change', e => {
  active = +e.target.value;
  syncEditor();
  renderAllThumbs();
  renderCard(active);
});

$('cardDuration').addEventListener('input', e => {
  $('secVal').textContent = `${e.target.value}초`;
});

// 폰트 크기 저장 버튼
$('saveFontScaleBtn').addEventListener('click', () => {
  const scale = $('fontScale').value;
  localStorage.setItem('savedFontScale', scale);
  $('renderStatus').textContent = `💾 폰트 크기 설정(${scale})이 성공적으로 저장되었습니다!`;
});

// 페이지 로드 시 저장된 폰트 크기 적용
const savedScale = localStorage.getItem('savedFontScale');
if (savedScale) {
  $('fontScale').value = savedScale;
}

// 해시태그 추천 및 단체 복사 기능
$('hashtagRecommendBtn').addEventListener('click', () => {
  const fullText = cards.map(c => c.text).join(' ');
  const baseTags = ['#humanology_daily', '#휴머니티', '#쇼츠', '#인간관계', '#심리학'];
  
  if (/연애|사랑|호감|썸|고백|남자|여자/.test(fullText)) {
    baseTags.push('#연애심리', '#연애조언', '#짝사랑', '#썸남썸녀', '#연애팁');
  }
  if (/고민|생각|속마음|거짓말|신중/.test(fullText)) {
    baseTags.push('#속마음', '#심리분석', '#마음건강', '#인간심리');
  }
  if (/친구|동료|사람|관계/.test(fullText)) {
    baseTags.push('#인간관계글귀', '#처세술', '#대화법');
  }

  currentHashtags = [...new Set(baseTags)];
  const tagBox = $('hashtagBox');
  const tagTags = $('hashtagTags');
  tagTags.innerHTML = '';

  currentHashtags.forEach(tag => {
    const span = document.createElement('span');
    span.className = 'tag-item selected';
    span.textContent = tag;
    span.addEventListener('click', () => {
      span.classList.toggle('selected');
    });
    tagTags.appendChild(span);
  });

  tagBox.style.display = 'block';
  $('renderStatus').textContent = '✨ 해시태그가 추천되었습니다! 태그를 선택/해제한 후 한 번에 복사해보세요.';
});

// 선택한 해시태그 한 번에 복사
$('copySelectedTagsBtn').addEventListener('click', () => {
  const selectedElements = document.querySelectorAll('#hashtagTags .tag-item.selected');
  const selectedText = Array.from(selectedElements).map(el => el.textContent).join(' ');
  
  if (!selectedText) {
    return alert('복사할 해시태그를 최소 1개 이상 선택해 주세요.');
  }

  navigator.clipboard.writeText(selectedText);
  $('renderStatus').textContent = `📋 선택된 해시태그 (${selectedElements.length}개) 복사 완료!`;
});

// 전체 해시태그 한 번에 복사
$('copyAllTagsBtn').addEventListener('click', () => {
  if (!currentHashtags.length) return;
  const allText = currentHashtags.join(' ');
  navigator.clipboard.writeText(allText);
  
  document.querySelectorAll('#hashtagTags .tag-item').forEach(el => el.classList.add('selected'));
  $('renderStatus').textContent = `✨ 전체 해시태그 (${currentHashtags.length}개) 복사 완료!`;
});

// 폴더에서 사진 읽기
$('folderInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
  if(!files.length) return;

  userImages = [];
  $('imageCount').textContent = `사진 읽는 중... (0/${files.length})`;

  for(let i=0; i<files.length; i++) {
    const file = files[i];
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.src = url;
    await new Promise(r => img.onload = r);
    userImages.push({ name: file.name.toLowerCase(), img: img });
    $('imageCount').textContent = `불러온 이미지: ${i+1}/${files.length}개`;
  }
  renderAll();
});

['fontFamily', 'accentColor', 'fontScale', 'bgDarkness', 'brandToggle', 'highlightWords'].forEach(id => {
  $(id).addEventListener('input', () => renderCard(active));
});

$('applyTextBtn').addEventListener('click', applyText);
$('resetTextBtn').addEventListener('click', resetText);

function parseScriptFromInput() {
  const t = $('scriptInput').value;
  const matches = [...t.matchAll(/(?:\[?CARD\s*(\d+)\]?|카드\s*(\d+))\s*[:.)-]?/gi)];
  let out = [];

  if (matches.length) {
    matches.forEach((m, i) => {
      const start = m.index + m[0].length;
      const end = i + 1 < matches.length ? matches[i + 1].index : t.length;
      const body = t.slice(start, end).trim();
      if (body) out.push({ n: +(m[1] || m[2]), text: body });
    });
  } else {
    out = t.split(/\n\s*\n/).map((x, i) => ({ n: i + 1, text: x.trim() })).filter(x => x.text);
  }

  cards = out.slice(0, 10).map(c => ({ ...c, original: c.text }));
  active = 0;
  populateSelect();
  syncEditor();
  renderAll();
  $('renderStatus').textContent = `${cards.length}장의 카드가 생성되었습니다.`;
}

function populateSelect() {
  const s = $("cardSelect");
  s.innerHTML = "";
  cards.forEach((c, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `카드 ${i + 1}`;
    s.appendChild(o);
  });
  s.value = active;
}

function syncEditor() {
  if (cards[active]) $('editText').value = cards[active].text;
}

function applyText() {
  if (!cards[active]) return;
  cards[active].text = $('editText').value.trim() || cards[active].text;
  renderAll();
  $('renderStatus').textContent = `카드 ${active + 1} 문구가 수정되었습니다.`;
}

function resetText() {
  if (!cards[active]) return;
  cards[active].text = cards[active].original || cards[active].text;
  syncEditor();
  renderAll();
  $('renderStatus').textContent = `카드 ${active + 1} 원문으로 복구되었습니다.`;
}

function getMatchedImage(cardIndex) {
  if (!userImages.length) return null;
  const text = (cards[cardIndex]?.text || '').toLowerCase();
  
  const matched = userImages.find(item => {
    if (/연애|사랑|호감|썸|고백/.test(text) && /love|heart|연애|사랑|호감/.test(item.name)) return true;
    if (/고민|생각|머릿속|신중/.test(text) && /think|mind|고민|생각/.test(item.name)) return true;
    if (/이유|비밀|진짜/.test(text) && /secret|reason|비밀/.test(item.name)) return true;
    return false;
  });

  if (matched) return matched.img;

  const index = cardIndex % userImages.length;
  return userImages[index].img;
}

// 🔥 고급스러운 다채로운 배경 렌더링 함수
function drawBg(ctx, cardIndex) {
  const img = getMatchedImage(cardIndex);
  
  if (img) {
    const imgRatio = img.width / img.height;
    const canvasRatio = W / H;
    let renderW, renderH, offsetX, offsetY;

    if (imgRatio > canvasRatio) {
      renderH = H;
      renderW = H * imgRatio;
      offsetX = (W - renderW) / 2;
      offsetY = 0;
    } else {
      renderW = W;
      renderH = W / imgRatio;
      offsetX = 0;
      offsetY = (H - renderH) / 2;
    }

    ctx.drawImage(img, offsetX, offsetY, renderW, renderH);

    const darkness = parseFloat($('bgDarkness').value);
    ctx.fillStyle = `rgba(0, 0, 0, ${darkness})`;
    ctx.fillRect(0, 0, W, H);
  } else {
    // 이미지가 없을 때 다양하고 감성적인 다중 그라데이션 및 빛 효과
    const themes = [
      { bg1: '#1e0c24', bg2: '#0b0f19', light: 'rgba(255, 60, 110, 0.35)' }, // 핑크/퍼플 몽환
      { bg1: '#0d1b2a', bg2: '#050811', light: 'rgba(64, 150, 255, 0.35)' }, // 디프 블루
      { bg1: '#261208', bg2: '#090810', light: 'rgba(255, 140, 50, 0.35)' }, // 웜 오렌지/선셋
      { bg1: '#180a1c', bg2: '#080d14', light: 'rgba(180, 70, 255, 0.35)' }, // 바이올렛 심리
      { bg1: '#0f2015', bg2: '#060a0f', light: 'rgba(50, 210, 120, 0.35)' }  // 에메랄드 감성
    ];

    const theme = themes[cardIndex % themes.length];

    // 1. 메인 대각선 그라데이션
    let g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, theme.bg1);
    g.addColorStop(0.6, theme.bg2);
    g.addColorStop(1, '#000000');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 2. 상단 중앙 몽환적인 감성 조명 (Radial Glow)
    let radial = ctx.createRadialGradient(W / 2, H * 0.35, 50, W / 2, H * 0.35, 650);
    radial.addColorStop(0, theme.light);
    radial.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = radial;
    ctx.fillRect(0, 0, W, H);

    // 3. 은은한 질감 보정이 있는 테두리 오버레이
    let vignette = ctx.createRadialGradient(W / 2, H / 2, W * 0.4, W / 2, H / 2, H * 0.7);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }
}

function parseTextTokens(text) {
  const manualWords = ($("highlightWords").value || '').split(',').map(x => x.trim()).filter(Boolean);
  const regex = /('[^']+'|"[^"]+"|\u201c[^\u201d]+\u201d|「[^」]+」|『[^』]+』)/g;
  let parts = [], lastIdx = 0, match;

  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIdx) parts.push({ text: text.substring(lastIdx, match.index), highlight: false });
    parts.push({ text: match[0], highlight: true });
    lastIdx = regex.lastIndex;
  }
  if (lastIdx < text.length) parts.push({ text: text.substring(lastIdx), highlight: false });

  if (manualWords.length > 0) {
    let newParts = [];
    parts.forEach(pt => {
      if (pt.highlight) newParts.push(pt);
      else {
        let reManual = new RegExp('(' + manualWords.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
        let subMatches = pt.text.split(reManual);
        subMatches.forEach(sm => {
          let isHigh = manualWords.some(mw => mw.toLowerCase() === sm.toLowerCase());
          newParts.push({ text: sm, highlight: isHigh });
        });
      }
    });
    return newParts;
  }
  return parts;
}

function drawTextBlock(ctx, text) {
  const scale = +$('fontScale').value;
  const fontFam = $('fontFamily').value;
  let fs = text.length > 100 ? 72 : text.length > 70 ? 82 : text.length > 40 ? 94 : 108;
  fs *= scale;

  ctx.font = `900 ${fs}px "${fontFam}", sans-serif`;
  const maxW = 820;
  const tokens = parseTextTokens(text);

  let words = [];
  tokens.forEach(tok => {
    let splitWords = tok.text.split(/(\s+)/);
    splitWords.forEach(w => { if (w) words.push({ text: w, highlight: tok.highlight }); });
  });

  let lines = [], currentLine = [], currentW = 0;
  words.forEach(wObj => {
    let wWidth = ctx.measureText(wObj.text).width;
    if (currentW + wWidth > maxW && currentLine.length > 0 && wObj.text.trim() !== '') {
      lines.push(currentLine);
      currentLine = [wObj];
      currentW = wWidth;
    } else {
      currentLine.push(wObj);
      currentW += wWidth;
    }
  });
  if (currentLine.length > 0) lines.push(currentLine);

  const lh = fs * 1.38;
  const totalH = lines.length * lh;
  let y = (H - totalH) / 2 + fs * 0.7;

  lines.forEach(ln => {
    let totalLineW = ln.reduce((acc, item) => acc + ctx.measureText(item.text).width, 0);
    let x = (W - totalLineW) / 2;

    ln.forEach(item => {
      ctx.font = `900 ${fs}px "${fontFam}", sans-serif`;
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(8, fs * 0.1);
      ctx.strokeStyle = 'rgba(5, 7, 12, 0.95)';
      ctx.fillStyle = item.highlight ? $('accentColor').value : '#ffffff';
      
      ctx.strokeText(item.text, x, y);
      ctx.fillText(item.text, x, y);
      x += ctx.measureText(item.text).width;
    });
    y += lh;
  });
}

function renderCardTo(canvas, i) {
  const ctx = canvas.getContext('2d');
  drawBg(ctx, i);

  if (!cards[i]) {
    ctx.fillStyle = '#8f98aa';
    ctx.font = '700 42px "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('대본을 입력하면 9:16 카드가 바로 생성됩니다', W / 2, H / 2);
    return;
  }

  drawTextBlock(ctx, cards[i].text);

  if ($('brandToggle').checked) {
    ctx.save();
    ctx.textAlign = 'center';
    const fontFam = $('fontFamily').value;
    ctx.font = `900 58px "${fontFam}", sans-serif`;

    ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.lineWidth = 10;
    ctx.strokeText('♥ humanology_daily', W / 2, H - 110);

    let bGrad = ctx.createLinearGradient(W / 2 - 200, 0, W / 2 + 200, 0);
    bGrad.addColorStop(0, '#ffffff');
    bGrad.addColorStop(0.5, '#ff758c');
    bGrad.addColorStop(1, '#ffffff');
    ctx.fillStyle = bGrad;
    ctx.fillText('♥ humanology_daily', W / 2, H - 110);
    ctx.restore();
  }
}

function renderCard(i) {
  if (!cards.length) {
    renderCardTo($('mainCanvas'), 0);
    return;
  }
  active = i;
  $('cardSelect').value = i;
  renderCardTo($('mainCanvas'), i);
  renderAllThumbs();
}

function renderAllThumbs() {
  const box = $('thumbs');
  box.innerHTML = '';
  cards.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (i === active ? ' active' : '');
    const cv = document.createElement('canvas');
    cv.width = 270;
    cv.height = 480;
    d.appendChild(cv);
    d.addEventListener('click', () => {
      active = i;
      $('cardSelect').value = i;
      syncEditor();
      renderAllThumbs();
      renderCard(i);
    });
    box.appendChild(d);
    renderCardTo(cv, i);
  });
}

function renderAll() {
  if (!cards.length) parseScriptFromInput();
  populateSelect();
  renderAllThumbs();
  renderCard(active);
}

// 영상 녹화 (마지막 카드 잘림 방지 반영)
async function recordVideo() {
  if (!cards.length) return alert("먼저 대본을 입력하고 카드를 생성해주세요.");
  
  const statusEl = $("renderStatus");
  statusEl.textContent = "🎬 영상 생성 시작 중...";

  const offCanvas = document.createElement("canvas");
  offCanvas.width = W;
  offCanvas.height = H;

  const durationSec = parseFloat($('cardDuration').value);
  const durationMs = durationSec * 1000;
  
  const stream = offCanvas.captureStream(30);
  
  let options = { mimeType: 'video/webm;codecs=vp9' };
  if (!MediaRecorder.isTypeSupported(options.mimeType)) {
    options = { mimeType: 'video/webm;codecs=vp8' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
      options = { mimeType: 'video/webm' };
    }
  }

  let recorder;
  try {
    recorder = new MediaRecorder(stream, options);
  } catch (e) {
    return alert("이 브라우저에서는 영상 녹화를 지원하지 않습니다.");
  }

  const chunks = [];
  recorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) chunks.push(e.data);
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "humanology_daily_shorts.webm";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 100);
    statusEl.textContent = `✅ 영상 저장 완료! (총 ${cards.length}장 × ${durationSec}초 정상 녹화 완료)`;
  };

  recorder.start();

  for (let i = 0; i < cards.length; i++) {
    statusEl.textContent = `🎬 영상 녹화 중... (${i + 1} / ${cards.length} 번째 카드 - ${durationSec}초)`;
    
    renderCardTo(offCanvas, i);
    await new Promise(resolve => requestAnimationFrame(resolve));
    await new Promise(resolve => setTimeout(resolve, durationMs));
  }

  statusEl.textContent = "🎬 마지막 프레임 인코딩 마무리 중...";
  await new Promise(resolve => setTimeout(resolve, 1200));

  recorder.stop();
}

document.fonts.ready.then(() => {
  parseScriptFromInput();
});
